time:
  timezone: "Asia/Jakarta"
  daily-reset: "00:00"
  date-format: "dd MMM yyyy HH:mm"

storage:
  type: "SQLITE" # SQLITE or MYSQL
  sqlite-file: "data/octarewardplus.db"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "octarewardplus"
    username: "root"
    password: "change-me"
    use-ssl: false
    maximum-pool-size: 10

autosave:
  interval-seconds: 60

playtime:
  count-afk: false
  afk-idle-minutes: 5
  excluded-worlds: []
  source: "DAILYREWARD_TRACKER" # DAILYREWARD_TRACKER, MINECRAFT_STATISTIC, ULTIMATEREWARDS_CUSTOM

reminders:
  enabled: false
  interval-minutes: 60

actions:
  allow-player-commands: false
  use-placeholderapi: true

gui:
  main-title: "&8✦ &bOctaReward Plus"
  category-title: "&8✦ &b%category%"
  size: 54
  main-size: 36
  filler:
    enabled: true
    material: PURPLE_STAINED_GLASS_PANE
    name: "&8·"
  main-slots:
    daily: 10
    weekly: 11
    monthly: 12
    streak: 14
    playtime: 15
    events: 16
    onetime: 22
  back-slot: 49
  previous-slot: 45
  next-slot: 53
  refresh-on-open: true

integrations:
  vault:
    enabled: true
    required: false
  ultimaterewards:
    enabled: true
    required: false
    listen-events: true
    lookup-example-reward: ""
    custom-playtime-calculator:
      enabled: false # OPT-IN: replaces UltimateRewards' playtime calculation globally.

debug: false
