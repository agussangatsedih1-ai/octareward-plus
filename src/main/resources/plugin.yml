name: OctaRewardPlus
prefix: "OctaReward Plus"
version: "0.0.1-SNAPSHOT"
main: id.tempestaria.dailyreward.DailyRewardPlugin
api-version: '1.21'
authors: [Alvran]
description: "Suprise me please"
softdepend: [UltimateRewards, PlaceholderAPI, Vault]
commands:
  dailyreward:
    description: Open the OctaReward Plus menu.
    aliases: [dr, dailyrewards, orp, octarewardplus]
    usage: /dailyreward [daily|streak|playtime|events|onetime|reload|stats|give|reset|event]
permissions:
  dailyreward.use:
    default: true
  dailyreward.admin:
    default: op
  dailyreward.reload:
    default: op
  dailyreward.give:
    default: op
  dailyreward.reset:
    default: op
  dailyreward.event.manage:
    default: op
  dailyreward.streak.bypass:
    default: op
  dailyreward.cooldown.bypass:
    default: op
  dailyreward.playtime.bypass:
    default: op
